# Despliega la función de IA (worker/) en Cloudflare, sin clonar nada en tu PC.
# Secretos del repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con la plantilla "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  el Account ID de tu cuenta de Cloudflare
#   ATELIER_ACCESS_KEY     una contraseña inventada (la misma que pondrás en la app)
name: Worker IA

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si faltan secretos
        if: env.HAS_CF != 'true'
        run: echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se despliega la función de IA."
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        if: env.HAS_CF == 'true'
        working-directory: worker
      - run: npm run check
        if: env.HAS_CF == 'true'
        working-directory: worker
      - name: Desplegar en Cloudflare
        id: deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: ACCESS_KEY
        env:
          ACCESS_KEY: ${{ secrets.ATELIER_ACCESS_KEY }}
      - name: URL de la función
        if: env.HAS_CF == 'true'
        run: |
          echo "### Función de IA desplegada" >> "$GITHUB_STEP_SUMMARY"
          echo "Pega esta URL en Atelier → Ajustes → Foto de producto con IA:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.deploy.outputs.deployment-url }}\`" >> "$GITHUB_STEP_SUMMARY"
