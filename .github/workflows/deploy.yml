# Compila, pasa los tests y sube dist/ por FTPS al subdominio en Nethosting.
# Necesita estos secretos del repo (Settings → Secrets and variables → Actions):
#   FTP_SERVER    p. ej. ftp.sangon.eu
#   FTP_USERNAME  la cuenta FTP del subdominio
#   FTP_PASSWORD
#   FTP_DIR       carpeta del subdominio, acabada en / (p. ej. /atelier.sangon.eu/)
name: Deploy Nethosting

# Desactivado de momento: solo se lanza a mano desde Actions cuando quieras usar tu dominio.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # El contexto secrets no se puede usar en if:, así que se pasa por env
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run fetch-model
      - run: npm run build
      - name: Subir por FTPS
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
      - name: Aviso si faltan secretos
        if: env.HAS_FTP != 'true'
        run: echo "::warning::Faltan los secretos FTP_*; build correcta pero no se ha desplegado."
