# Versión de pruebas en GitHub Pages: https://euzapus.github.io/Atelier/
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Modelo de recorte (~170 MB): no está en git, se descarga del paquete oficial de IMG.LY
      - run: npm run fetch-model
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages no tiene reescrituras: 404.html = index.html para que funcionen los enlaces directos
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
